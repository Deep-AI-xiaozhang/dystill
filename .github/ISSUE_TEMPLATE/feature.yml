name: 功能建议
description: 提出一个新功能或改进建议。请先确认它符合「只做抖音、本地优先、笔记可回查」的定位。
title: "[Feature] "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私自查（必填）
      options:
        - label: 我已确认没有粘贴 API key / token / cookie 等任何凭据
          required: true
        - label: 我已确认没有粘贴私人视频链接、笔记原文或本机敏感路径
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      description: 不确定就选「其他 / 不确定」。
      options:
        - 下载（抖音 / B 站 / 浏览器兜底）
        - 转写与清洗（STT）
        - 画面理解（切帧 / VLM）
        - 笔记生成
        - 事实核对（claim / evidence / verifier）
        - CLI / 配置 / 安装
        - 文档
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景和当前的痛点，而不是直接给方案。
      placeholder: "我在……时会遇到……，希望……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 如果有具体的 CLI/配置/输出格式想法，请写清楚。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议不要求把本工具扩展成通用视频/多平台工具
          required: false
        - label: 这个建议不需要把用户的视频或笔记上传到第三方服务
          required: false
